stages:
  - test

test-ssh:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 34.58.216.152 >> ~/.ssh/known_hosts
  script:
    - ssh gitlab-deploy@34.58.216.152 "echo '✅ SSH connection successful from GitLab!'"
